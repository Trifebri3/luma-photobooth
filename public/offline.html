<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline - Luma Photobooth by YOTA INOVASI NUSANTARA</title>
  <meta name="theme-color" content="#0D9488">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: #F0FDFA;
      border: 2px solid #CCFBF1;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      color: #0D9488;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 0.75rem;
    }
    p {
      color: #64748B;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #0D9488;
      color: #FFFFFF;
      font-weight: 600;
      padding: 0.875rem 1.75rem;
      border-radius: 0.75rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-size: 0.95rem;
      transition: all 0.2s;
      width: 100%;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }
    .btn:hover {
      background: #0F766E;
      transform: translateY(-1px);
    }
    .brand {
      margin-top: 2rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #94A3B8;
      text-transform: uppercase;
    }
    .brand span {
      color: #0D9488;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364m0 0a9 9 0 012.828-6.364m0 0l2.829 2.829m-2.829-2.829L3 3m6.364 6.364a5 5 0 017.072 0" />
      </svg>
    </div>

    <h1>Koneksi Sedang Terputus</h1>
    <p>
      Anda sedang tidak terhubung ke jaringan internet. Mode offline siap menjaga photobooth tetap aman. Silakan periksa koneksi Wi-Fi atau data seluler Anda dan coba muat ulang.
    </p>

    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Coba Muat Ulang Halaman
    </button>

    <div class="brand">
      Luma Photobooth <span>by YOTA INOVASI NUSANTARA</span>
    </div>
  </div>
</body>
</html>
